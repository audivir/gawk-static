name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/fetch-submodules.sh vendor/gawk
      - name: Check that the release tag matches vendor/gawk
        run: |
          gawk_version="v$(sed -n 's/^AC_INIT(\[GNU Awk\],\[\([^]]*\)\].*/\1/p' vendor/gawk/configure.ac)"
          if [ "$gawk_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match vendor/gawk ($gawk_version)"
            exit 1
          fi
  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-15
            asset: macos-arm64
          - os: ubuntu-latest
            asset: linux-amd64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: ubuntu-latest
            asset: linux-musl-amd64
            static: true
          - os: ubuntu-24.04-arm
            asset: linux-musl-arm64
            static: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/fetch-submodules.sh
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - run: ./build.sh ${{ matrix.static && '--static' || '' }}
      - name: Package gawk
        run: |
          dist="dist${{ matrix.static && '-static' || '' }}"
          tar -czf gawk-static-${{ matrix.asset }}.tar.gz -C "$dist" bin share
      - name: Collect sources
        if: matrix.asset == 'linux-amd64'
        run: tar -czf gawk-static-sources.tar.gz --exclude=.git vendor
      - uses: actions/upload-artifact@v7
        with:
          name: gawk-static-${{ matrix.asset }}
          path: gawk-static-*.tar.gz
          retention-days: 1
  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gawk-static-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
